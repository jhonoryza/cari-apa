<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cari Apa</title>
<meta name="description" content="Cari Apa — mesin pencari web yang menghormati privasi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C65D3B'/%3E%3Ccircle cx='14' cy='14' r='7' fill='none' stroke='%23FAF8F5' stroke-width='2.5'/%3E%3Cline x1='19.5' y1='19.5' x2='26' y2='26' stroke='%23FAF8F5' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Anthropic brand fonts (via jsDelivr, pinned commit) — https://github.com/matthieuhuguet/anthropic-fonts */
@font-face{
  font-family:"AnthropicSans";
  src:url("https://cdn.jsdelivr.net/gh/matthieuhuguet/anthropic-fonts@4fdbcccccc3643e79ed16a54c4a25a8ef2d3db50/woff2-original/AnthropicSans-Romans.woff2") format("woff2");
  font-weight:300 800; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"AnthropicSans";
  src:url("https://cdn.jsdelivr.net/gh/matthieuhuguet/anthropic-fonts@4fdbcccccc3643e79ed16a54c4a25a8ef2d3db50/woff2-original/AnthropicSans-Italics.woff2") format("woff2");
  font-weight:300 800; font-style:italic; font-display:swap;
}
@font-face{
  font-family:"AnthropicSerif";
  src:url("https://cdn.jsdelivr.net/gh/matthieuhuguet/anthropic-fonts@4fdbcccccc3643e79ed16a54c4a25a8ef2d3db50/woff2-original/AnthropicSerif-Romans.woff2") format("woff2");
  font-weight:300 800; font-style:normal; font-display:swap;
}
@font-face{
  font-family:"AnthropicSerif";
  src:url("https://cdn.jsdelivr.net/gh/matthieuhuguet/anthropic-fonts@4fdbcccccc3643e79ed16a54c4a25a8ef2d3db50/woff2-original/AnthropicSerif-Italics.woff2") format("woff2");
  font-weight:300 800; font-style:italic; font-display:swap;
}
@font-face{
  font-family:"AnthropicMono";
  src:url("https://cdn.jsdelivr.net/gh/matthieuhuguet/anthropic-fonts@4fdbcccccc3643e79ed16a54c4a25a8ef2d3db50/woff2-original/AnthropicMono.woff2") format("woff2");
  font-weight:300 800; font-style:normal; font-display:swap;
}
:root{
  --bg:#FAF8F5; --bg-soft:#F2EEE6; --card:#FFFFFF;
  --border:#E7E1D4; --border-strong:#D8D0BE;
  --fg:#211F1B; --fg-soft:#4C483F; --muted:#7C766A; --faint:#ABA398;
  --coral:#C65D3B; --coral-deep:#9C4526; --coral-soft:#F7E4D7;
  --ink:#2A2721; --ink-fg:#FAF8F5;
  --visited:#6E56A8;
  --ring:rgba(198,93,59,.28);
  --mono:"AnthropicMono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(33,31,27,.05), 0 8px 28px -12px rgba(33,31,27,.18);
  --shadow-lg:0 2px 6px rgba(33,31,27,.06), 0 24px 64px -16px rgba(33,31,27,.28);
}
[data-theme="dark"]{
  --bg:#171614; --bg-soft:#201E1C; --card:#232120;
  --border:#383431; --border-strong:#4A453E;
  --fg:#EDE8DE; --fg-soft:#CFC8B9; --muted:#9C9487; --faint:#6B6459;
  --coral:#D97B54; --coral-deep:#E89A74; --coral-soft:#3A2921;
  --ink:#EDE8DE; --ink-fg:#171614;
  --visited:#9B86D6;
  --ring:rgba(217,123,84,.32);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px -12px rgba(0,0,0,.5);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4), 0 24px 64px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box; margin:0; padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"AnthropicSans",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--fg);
  min-height:100vh; transition:background .25s ease, color .25s ease;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--coral-soft)}
a{color:inherit}
button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select{font:inherit; color:inherit}
.serif{font-family:"AnthropicSerif",Georgia,serif}

/* ---------- shared components (shadcn-ish) ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  height:2.75rem; padding:0 1.4rem; border-radius:.8rem;
  font-weight:600; font-size:.92rem; letter-spacing:.01em;
  border:1px solid var(--border); background:var(--card); color:var(--fg);
  transition:all .15s ease; white-space:nowrap;
}
.btn:hover{border-color:var(--border-strong); transform:translateY(-1px); box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--ink); color:var(--ink-fg); border-color:var(--ink)}
.btn-primary:hover{background:var(--coral); border-color:var(--coral); color:#fff}
.btn-sm{height:2.25rem; padding:0 .9rem; font-size:.82rem; border-radius:.65rem}
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:2.5rem; height:2.5rem; border-radius:.75rem; color:var(--muted);
  border:1px solid transparent; transition:all .15s ease; flex:none;
}
.icon-btn:hover{background:var(--bg-soft); color:var(--fg); border-color:var(--border)}
.icon-btn svg{width:1.15rem; height:1.15rem}
.input{
  width:100%; height:3.5rem; border-radius:1rem;
  border:1.5px solid var(--border-strong); background:var(--card);
  padding:0 1.1rem 0 3.2rem; font-size:1.02rem; outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.input::placeholder{color:var(--faint)}
.input:focus{border-color:var(--coral); box-shadow:0 0 0 4px var(--ring)}
.input-sm{height:2.6rem; border-radius:.8rem; font-size:.9rem; padding-left:2.7rem}
.card{
  background:var(--card); border:1px solid var(--border);
  border-radius:1rem; box-shadow:var(--shadow);
}
.chip{
  display:inline-flex; align-items:center; gap:.4rem;
  padding:.45rem .95rem; border-radius:999px; font-size:.84rem; font-weight:500;
  border:1px solid var(--border); background:var(--card); color:var(--fg-soft);
  transition:all .15s ease; white-space:nowrap; max-width:100%;
}
.chip svg{width:.85rem; height:.85rem; flex:none}
.chip span{overflow:hidden; text-overflow:ellipsis}
.chip:hover{border-color:var(--coral); color:var(--coral-deep); transform:translateY(-1px)}
.badge{
  display:inline-flex; align-items:center; gap:.3rem;
  font-size:.68rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  padding:.22rem .6rem; border-radius:999px;
  background:var(--bg-soft); color:var(--muted); border:1px solid var(--border);
}
.label{font-size:.75rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:.45rem; display:block}
.select{
  height:2.5rem; border-radius:.7rem; border:1px solid var(--border);
  background:var(--card); padding:0 .8rem; font-size:.87rem; outline:none; cursor:pointer;
}
.select:focus{border-color:var(--coral); box-shadow:0 0 0 3px var(--ring)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ---------- home view ---------- */
#view-home{min-height:100vh; display:flex; flex-direction:column}
.home-top{display:flex; justify-content:flex-end; align-items:center; gap:.35rem; padding:1.1rem 1.4rem}
.home-main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 1.25rem 8vh; width:100%}
.brand{display:flex; align-items:baseline; gap:.65rem; margin-bottom:.6rem; user-select:none}
.brand-mark{
  width:3rem; height:3rem; border-radius:1rem; background:var(--coral);
  display:inline-flex; align-items:center; justify-content:center; align-self:center;
  box-shadow:var(--shadow);
}
.brand-mark svg{width:1.6rem; height:1.6rem; color:#fff}
.brand h1{font-size:clamp(2.6rem,6vw,3.6rem); font-weight:600; letter-spacing:-.02em}
.brand h1 em{font-style:italic; color:var(--coral-deep); font-weight:500}
.tagline{color:var(--muted); font-size:1rem; margin-bottom:2.2rem; text-align:center; max-width:34rem; line-height:1.6}
.search-wrap{width:100%; max-width:38rem; position:relative}
.search-icon{position:absolute; left:1.15rem; top:50%; transform:translateY(-50%); color:var(--faint); pointer-events:none; display:flex}
.search-icon svg{width:1.25rem; height:1.25rem}
/* form home berisi input + tombol, jadi ikon harus center terhadap input (3.5rem), bukan form */
#home-form .search-icon{top:1.75rem}
.search-actions{display:flex; gap:.8rem; justify-content:center; margin-top:1.6rem; flex-wrap:wrap}
.recent{margin-top:2.6rem; width:100%; max-width:38rem}
.recent h2{font-size:.75rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:.8rem; text-align:center}
.recent-chips{display:flex; flex-wrap:wrap; gap:.55rem; justify-content:center}
.home-foot{padding:1.4rem; text-align:center; color:var(--faint); font-size:.8rem; display:flex; gap:1.2rem; justify-content:center; flex-wrap:wrap}
.home-foot a{text-decoration:none; border-bottom:1px dotted var(--border-strong)}
.home-foot a:hover{color:var(--coral-deep); border-color:var(--coral)}
kbd.hint{font-family:var(--mono); font-size:.72rem; border:1px solid var(--border-strong); border-bottom-width:2px; border-radius:.4rem; padding:.1rem .45rem; background:var(--card); color:var(--muted)}

/* ---------- results view ---------- */
#view-results{display:none; min-height:100vh; flex-direction:column}
.res-header{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.res-bar{display:flex; align-items:center; gap:.9rem; padding:.85rem 1.4rem; max-width:72rem; margin:0 auto; width:100%}
.res-logo{display:flex; align-items:center; gap:.55rem; text-decoration:none; flex:none}
.res-logo .brand-mark{width:2.1rem; height:2.1rem; border-radius:.6rem}
.res-logo .brand-mark svg{width:1.1rem; height:1.1rem}
.res-logo span{font-size:1.25rem; font-weight:600; letter-spacing:-.01em}
.res-logo span em{font-style:italic; color:var(--coral-deep); font-weight:500}
.res-search{position:relative; flex:1; max-width:44rem}
.res-search .search-icon{left:.95rem}
.res-search .search-icon svg{width:1.05rem; height:1.05rem}
.res-tools{display:flex; gap:.3rem; margin-left:auto}
.tabs-row{max-width:72rem; margin:0 auto; width:100%; padding:0 1.4rem; display:flex; align-items:center; gap:.25rem; overflow-x:auto; scrollbar-width:none}
.tabs-row::-webkit-scrollbar{display:none}
.tab{
  display:inline-flex; align-items:center; gap:.45rem; padding:.7rem .95rem;
  font-size:.88rem; font-weight:500; color:var(--muted); white-space:nowrap;
  border-bottom:2.5px solid transparent; margin-bottom:-1px; transition:all .15s ease;
}
.tab svg{width:1rem; height:1rem}
.tab:hover{color:var(--fg)}
.tab.active{color:var(--coral-deep); border-bottom-color:var(--coral); font-weight:600}
.timerange{margin-left:auto; padding-bottom:.35rem; flex:none}
.res-body{flex:1; width:100%; max-width:72rem; margin:0 auto; padding:1.4rem 1.4rem 4rem}
.meta-line{font-size:.83rem; color:var(--muted); margin-bottom:1.1rem; display:flex; align-items:center; gap:.6rem; flex-wrap:wrap}
.correction{margin-bottom:1rem; font-size:.95rem}
.correction button{color:var(--coral-deep); font-weight:600; font-style:italic}
.correction button:hover{text-decoration:underline}
.answer-card{
  display:flex; gap:1rem; align-items:center; padding:1.1rem 1.3rem; margin-bottom:1.4rem;
  background:linear-gradient(135deg, var(--coral-soft), var(--card)); max-width:44rem;
}
.answer-card .answer{font-family:var(--mono); font-size:1.5rem; font-weight:700; letter-spacing:-.01em}
.answer-card .answer-q{font-size:.85rem; color:var(--muted)}

/* result list */
.result{padding:1.05rem 0; border-bottom:1px solid var(--border); max-width:44rem}
.result:last-child{border-bottom:none}
.result-crumb{display:flex; align-items:center; gap:.55rem; margin-bottom:.3rem; font-size:.8rem; color:var(--muted)}
.favicon{width:1.25rem; height:1.25rem; border-radius:.35rem; background:var(--bg-soft); border:1px solid var(--border); display:inline-flex; align-items:center; justify-content:center; font-size:.65rem; font-weight:700; color:var(--muted); flex:none; overflow:hidden}
.favicon img{width:100%; height:100%; object-fit:cover}
.crumb-url{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:26rem}
.result-title{display:block; font-size:1.22rem; font-weight:500; line-height:1.35; text-decoration:none; margin-bottom:.3rem; letter-spacing:-.005em}
.result-title:hover{text-decoration:underline; text-decoration-color:var(--coral); text-underline-offset:3px}
.result-title:visited{color:var(--visited)}
.result-snippet{font-size:.92rem; line-height:1.65; color:var(--fg-soft)}
.result-meta{display:flex; align-items:center; gap:.5rem; margin-top:.45rem; font-size:.74rem; color:var(--faint)}
.engine-dot{width:.35rem; height:.35rem; border-radius:50%; background:var(--faint); display:inline-block}

/* images grid */
.img-grid{columns:4 200px; column-gap:.9rem}
.img-card{break-inside:avoid; margin-bottom:.9rem; border-radius:.9rem; overflow:hidden; border:1px solid var(--border); background:var(--card); position:relative; display:block; text-decoration:none; transition:transform .15s ease, box-shadow .15s ease}
.img-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg)}
.img-card img{width:100%; display:block; background:var(--bg-soft)}
.img-card .img-cap{padding:.6rem .8rem; font-size:.78rem; color:var(--fg-soft); line-height:1.45; display:flex; gap:.5rem; align-items:flex-start}
.img-card .img-cap .favicon{width:1rem; height:1rem; font-size:.55rem; margin-top:.1rem}
.img-card .play{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none}
.img-card .play span{width:3rem; height:3rem; border-radius:50%; background:rgba(20,18,16,.72); display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px)}
.img-card .play svg{width:1.3rem; height:1.3rem; color:#fff; margin-left:2px}

/* suggestions */
.suggest-block{margin:2.2rem 0 0; max-width:44rem}
.suggest-block h3{font-size:1.05rem; font-weight:600; margin-bottom:.9rem}
.suggest-grid{display:grid; grid-template-columns:1fr 1fr; gap:.5rem}
@media(max-width:560px){.suggest-grid{grid-template-columns:1fr}}
.suggest-item{display:flex; align-items:center; gap:.7rem; padding:.7rem .9rem; border:1px solid var(--border); border-radius:.8rem; background:var(--card); font-size:.88rem; text-decoration:none; transition:all .15s ease}
.suggest-item:hover{border-color:var(--coral); transform:translateY(-1px)}
.suggest-item svg{width:.95rem; height:.95rem; color:var(--faint); flex:none}

/* pagination */
.pager{display:flex; align-items:center; justify-content:center; gap:.4rem; margin:2.6rem 0 1rem; flex-wrap:wrap}
.page-btn{min-width:2.6rem; height:2.6rem; padding:0 .7rem; border-radius:.75rem; border:1px solid var(--border); background:var(--card); font-size:.9rem; font-weight:500; color:var(--fg-soft); display:inline-flex; align-items:center; justify-content:center; gap:.35rem; transition:all .15s ease}
.page-btn:hover:not(:disabled){border-color:var(--coral); color:var(--coral-deep)}
.page-btn.active{background:var(--ink); color:var(--ink-fg); border-color:var(--ink); font-weight:600}
.page-btn:disabled{opacity:.4; cursor:default}
.page-btn[disabled]{opacity:.4; cursor:default; pointer-events:none}
.page-btn svg{width:1rem; height:1rem}

/* skeletons */
.skel{max-width:44rem}
.skel-row{padding:1rem 0; border-bottom:1px solid var(--border)}
.shimmer{position:relative; overflow:hidden; background:var(--bg-soft); border-radius:.5rem}
.shimmer::after{content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent); animation:sh 1.3s infinite}
[data-theme="dark"] .shimmer::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
@keyframes sh{to{transform:translateX(100%)}}

/* states */
.state-card{max-width:34rem; margin:4rem auto; text-align:center; padding:2.5rem 2rem}
.state-card .big-ico{width:3.6rem; height:3.6rem; border-radius:1.1rem; background:var(--coral-soft); color:var(--coral-deep); display:inline-flex; align-items:center; justify-content:center; margin-bottom:1.2rem}
.state-card .big-ico svg{width:1.8rem; height:1.8rem}
.state-card h2{font-size:1.3rem; font-weight:600; margin-bottom:.6rem}
.state-card p{color:var(--muted); font-size:.92rem; line-height:1.7; margin-bottom:1.4rem}
.state-card code{font-family:var(--mono); font-size:.8em; background:var(--bg-soft); border:1px solid var(--border); border-radius:.4rem; padding:.12rem .45rem}
.setup-steps{text-align:left; background:var(--bg-soft); border:1px solid var(--border); border-radius:.9rem; padding:1.1rem 1.3rem; margin-bottom:1.4rem; font-size:.86rem; line-height:1.7; color:var(--fg-soft)}
.setup-steps ol{padding-left:1.2rem; display:grid; gap:.55rem}

/* modal */
.modal-back{position:fixed; inset:0; background:rgba(24,22,19,.5); backdrop-filter:blur(6px); z-index:100; display:none; align-items:flex-start; justify-content:center; padding:8vh 1rem 1rem}
.modal-back.open{display:flex}
.modal{width:100%; max-width:30rem; animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px) scale(.98); opacity:0}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:1.2rem 1.4rem .4rem}
.modal-head h2{font-size:1.1rem; font-weight:600}
.modal-body{padding:1rem 1.4rem 1.4rem; display:grid; gap:1.05rem}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:.8rem}
.modal-foot{display:flex; justify-content:flex-end; gap:.6rem; padding:0 1.4rem 1.4rem}

/* toast */
#toast{position:fixed; bottom:1.4rem; left:50%; transform:translate(-50%,20px); opacity:0; z-index:200; background:var(--ink); color:var(--ink-fg); padding:.8rem 1.3rem; border-radius:.9rem; font-size:.88rem; font-weight:500; box-shadow:var(--shadow-lg); transition:all .25s ease; pointer-events:none; max-width:90vw; text-align:center}
#toast.show{transform:translate(-50%,0); opacity:1}

.hidden{display:none !important}
@media(max-width:640px){
  .res-bar{flex-wrap:wrap; gap:.6rem}
  .res-logo span{display:none}
  .res-search{order:3; flex-basis:100%; max-width:none}
  .timerange{margin-left:0}
  .crumb-url{max-width:14rem}
}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<div id="view-home">
  <div class="home-top">
    <button class="icon-btn" id="theme-home" title="Ganti tema" aria-label="Ganti tema"></button>
    <button class="icon-btn" id="settings-home" title="Pengaturan" aria-label="Pengaturan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <main class="home-main">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      </span>
      <h1 class="serif">Cari <em>Apa</em></h1>
    </div>
    <p class="tagline">Cari seluruh web tanpa dilacak. Hasil gabungan dari banyak mesin pencari.</p>
    <form class="search-wrap" id="home-form" autocomplete="off">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      </span>

/* ---------------- router (hash) ---------------- */
let state = { q: "", cat: "general", page: 1, timeRange: "" };
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  if(!h) return null;
  const p = new URLSearchParams(h);
  return { q: p.get("q") || "", cat: p.get("cat") || "general", page: parseInt(p.get("page") || "1", 10) || 1, timeRange: p.get("time") || "" };
}
function buildHash(s){
  const p = new URLSearchParams({ q: s.q, cat: s.cat, page: String(s.page) });
  if(s.timeRange) p.set("time", s.timeRange);
  return "#/?" + p.toString();
}
function go(patch){
  Object.assign(state, patch);
  if(!TABS.some(t => t.id === state.cat)) state.cat = "general";
  const next = buildHash(state);
  if(location.hash === next){ route(); }  // hash sama -> hashchange tak fire, paksa re-search
  else location.hash = next;
}
window.addEventListener("hashchange", route);

/* ---------------- searxng client ---------------- */
async function searxSearch({ q, cat, page, timeRange }){
  const base = settings.base.replace(/\/+$/, "");
  const p = new URLSearchParams({
    q, format: "json", pageno: String(page),
    language: settings.lang, safesearch: settings.safe
  });
  if(cat && cat !== "general") p.set("categories", cat);
  if(timeRange) p.set("time_range", timeRange);
  const url = base + "/search?" + p.toString();
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 25000);
  try {
    const res = await fetch(url, { signal: ctrl.signal, headers: { "Accept": "application/json" } });
    clearTimeout(t);
    if(res.status === 403){
      const e = new Error("forbidden"); e.code = 403; throw e;
    }
    if(!res.ok){ const e = new Error("http " + res.status); e.code = res.status; throw e; }
    return await res.json();
  } catch(err){
    clearTimeout(t);
    if(err.name === "AbortError"){ const e = new Error("timeout"); e.code = "timeout"; throw e; }
    if(err.code) throw err;
    const e = new Error("network"); e.code = "network"; throw e;
  }
}

/* ---------------- render helpers ---------------- */
function domainOf(url){
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; }
}
function faviconHTML(url, size){
  const d = domainOf(url);
  const letter = (d[0] || "?").toUpperCase();
  return `<span class="favicon" aria-hidden="true"><img loading="lazy" src="https://www.google.com/s2/favicons?domain=${esc(d)}&sz=${size || 64}" alt="" onerror="this.remove()">${letter}</span>`;
}
function fmtNum(n){
  if(n == null) return "";
  return n >= 1000 ? n.toLocaleString("id-ID") : String(n);
}
function skeletons(){
  let h = '<div class="skel" aria-hidden="true">';
  for(let i = 0; i < 6; i++){
    h += `<div class="skel-row">
      <div class="shimmer" style="height:.85rem;width:38%;margin-bottom:.6rem"></div>
      <div class="shimmer" style="height:1.3rem;width:72%;margin-bottom:.6rem"></div>
      <div class="shimmer" style="height:.85rem;width:95%"></div>
      <div class="shimmer" style="height:.85rem;width:80%;margin-top:.4rem"></div>
    </div>`;
  }
  return h + "</div>";
}

function renderResultList(data){
  const rs = data.results || [];
  if(!rs.length) return "";
  return rs.map(r => {
    const url = r.url || "#";
    const title = r.title || domainOf(url);
    const content = r.content || "";
    const engines = (r.engines || []).slice(0, 3).join(" · ");
    const date = r.publishedDate ? `<span>${esc(r.publishedDate)}</span><span class="engine-dot"></span>` : "";
    return `<article class="result">
      <div class="result-crumb">${faviconHTML(url)}<span class="crumb-url">${esc(domainOf(url))}</span></div>
      <a class="result-title" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a>
      <p class="result-snippet">${esc(content)}</p>
      <div class="result-meta">${date}${engines ? `<span>via ${esc(engines)}</span>` : ""}</div>
    </article>`;
  }).join("");
}

  if(!sugs.length) return "";
  return `<section class="suggest-block"><h3>Penelusuran terkait</h3><div class="suggest-grid">` +
    sugs.map(s => `<a class="suggest-item" href="${esc(buildHash({ q: s, cat: state.cat, page: 1, timeRange: state.timeRange }))}">${ICONS.search}<span>${esc(s)}</span></a>`).join("") +
    `</div></section>`;
}

function renderPager(total, page, count){
  const perPage = 10;
  const pages = total > 0 ? Math.min(10, Math.max(1, Math.ceil(total / perPage))) : 0;
  const link = p => esc(buildHash({ q: state.q, cat: state.cat, page: p, timeRange: state.timeRange }));
  const prevBtn = cur => `<a class="page-btn"${cur <= 1 ? " disabled" : ` href="${link(cur - 1)}"`} aria-label="Sebelumnya">${ICONS.chevL}</a>`;
  const nextBtn = (cur, enabled) => `<a class="page-btn"${enabled ? ` href="${link(cur + 1)}"` : " disabled"} aria-label="Berikutnya">${ICONS.chevR}</a>`;
  if(pages > 0){
    if(pages <= 1 && page <= 1) return "";
    const cur = Math.min(page, pages);
    let nums = [];
    for(let p = Math.max(1, cur - 4); p <= Math.min(pages, cur + 4); p++) nums.push(p);
    return `<nav class="pager" aria-label="Halaman hasil">${prevBtn(cur)}
      ${nums.map(p => `<a class="page-btn${p === cur ? " active" : ""}" href="${link(p)}" aria-label="Halaman ${p}"${p === cur ? ' aria-current="page"' : ""}>${p}</a>`).join("")}
      ${nextBtn(cur, cur < pages)}</nav>`;
  }
  // SearXNG tidak selalu memberi number_of_results — tampilkan prev/next sederhana
  if(count > 0 && page >= 1){
    const nextOn = count >= perPage;
    if(page <= 1) return `<nav class="pager" aria-label="Halaman hasil"><span class="page-btn active" aria-current="page">1</span>${nextBtn(1, nextOn)}</nav>`;
    return `<nav class="pager" aria-label="Halaman hasil">${prevBtn(page)}<span class="page-btn active" aria-current="page">${page}</span>${nextBtn(page, nextOn)}</nav>`;
  }
  return "";
}

function renderCorrection(corrections, q){
  const c = (corrections || []).filter(Boolean)[0];
  if(!c || c.toLowerCase() === q.toLowerCase()) return "";
  return `<p class="correction">Maksud Anda: <button data-correct="${esc(c)}">${esc(c)}</button>?</p>`;
}

function renderAnswers(answers, q){
  const a = (answers || []).filter(Boolean)[0];
  if(!a) return "";
  return `<div class="card answer-card"><div><div class="answer-q">${esc(q)} =</div><div class="answer">${esc(a)}</div></div></div>`;
}

/* ---------------- render: states ---------------- */
function renderError(err){
  const body = $("#res-body");
  if(err.code === 403){
    body.innerHTML = `<div class="card state-card">
      <span class="big-ico">${ICONS.alert}</span>
      <h2>Format JSON belum diaktifkan</h2>
      <p>SearXNG di <code>${esc(settings.base)}</code> menolak format <code>json</code> (HTTP 403). Aktifkan dulu supaya aplikasi ini bisa membaca hasil pencarian.</p>
      <div class="setup-steps"><ol>
        <li>Di server SearXNG, buka <code>settings.yml</code> lalu tambahkan <code>json</code> ke <code>search.formats</code>, kemudian restart SearXNG.</li>
        <li>Tambahkan header CORS <code>Access-Control-Allow-Origin: *</code> untuk path <code>/search</code> — bisa lewat reverse proxy (nginx/caddy) atau Cloudflare Transform Rule.</li>
      </ol></div>
      <button class="btn btn-primary" id="err-retry">Coba lagi</button>
    </div>`;
  } else if(err.code === "timeout"){
    body.innerHTML = `<div class="card state-card">
      <span class="big-ico">${ICONS.alert}</span>
      <h2>Waktu habis</h2>
      <p>Server SearXNG tidak merespons dalam 25 detik. Mungkin sedang sibuk atau tidak dapat dijangkau.</p>
      <button class="btn btn-primary" id="err-retry">Coba lagi</button>
    </div>`;
  } else {
    body.innerHTML = `<div class="card state-card">
      <span class="big-ico">${ICONS.alert}</span>
      <h2>Tidak dapat terhubung</h2>
      <p>Periksa URL SearXNG di pengaturan dan pastikan server dapat diakses dari browser ini. ${err.code && err.code !== "network" ? `(HTTP ${esc(String(err.code))})` : ""}</p>
      <div style="display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" id="err-retry">Coba lagi</button>
        <button class="btn" id="err-settings">Buka pengaturan</button>
      </div>
    </div>`;
  }
  const r = $("#err-retry"); if(r) r.addEventListener("click", () => runSearch());
  const s = $("#err-settings"); if(s) s.addEventListener("click", openModal);
}

function renderEmpty(){
  $("#res-body").innerHTML = `<div class="card state-card">
    <span class="big-ico">${ICONS.inbox}</span>
    <h2>Tidak ada hasil untuk “${esc(state.q)}”</h2>
    <p>Coba periksa ejaan, gunakan kata kunci yang lebih umum, atau kurangi jumlah kata.</p>
    <button class="btn" id="empty-home">Kembali ke beranda</button>
  </div>`;
  $("#empty-home").addEventListener("click", () => { location.hash = "#/"; });
}

/* ---------------- main search flow ---------------- */
let searchSeq = 0;
async function runSearch(){
  const body = $("#res-body");
  document.title = `${state.q} - Cari Apa`;
  body.innerHTML = `<div class="meta-line"><span class="badge">Mencari</span></div>` + skeletons();
  const seq = ++searchSeq;
  const mock = maybeMock();
  try {
    const t0 = performance.now();
    const data = mock || await searxSearch(state);
    if(seq !== searchSeq) return;
    const dt = ((performance.now() - t0) / 1000).toFixed(2);
    pushRecent(state.q); renderRecent();
    renderResultsView(data, dt);
  } catch(err){
    if(seq !== searchSeq) return;
    renderError(err);
  }
}

function renderResultsView(data, dt){
  const body = $("#res-body");
  const total = data.number_of_results || 0;
  const isImg = state.cat === "images" || state.cat === "videos";
  const listHTML = isImg ? renderImages(data) : renderResultList(data);
  const unresp = (data.unresponsive_engines || []).length;

  let h = `<div class="meta-line">`;
  h += total ? `<span>Sekitar <strong>${fmtNum(total)}</strong> hasil</span><span class="engine-dot"></span><span>${dt} detik</span>`
             : `<span>Hasil untuk “${esc(state.q)}”</span>`;
  if(unresp) h += `<span class="badge" title="Beberapa engine tidak merespons">${unresp} engine lambat</span>`;
  h += `</div>`;
  h += renderCorrection(data.corrections, state.q);
  h += renderAnswers(data.answers, state.q);
  h += listHTML || "";
  if(!listHTML){ renderEmpty(); return; }
  h += renderSuggestions(data.suggestions);
  h += renderPager(total, state.page, (data.results || []).length);
  body.innerHTML = h;

  const cb = $("[data-correct]");
  if(cb) cb.addEventListener("click", () => go({ q: cb.dataset.correct, page: 1 }));
}

/* ---------------- routing ---------------- */
function route(){
  const p = parseHash();
  if(!p || !p.q){
    $("#view-home").style.display = "flex";
    $("#view-results").style.display = "none";
    document.title = "Cari Apa";
    $("#home-q").value = "";
    return;
  }
  state = Object.assign(state, p);
  $("#view-home").style.display = "none";
  $("#view-results").style.display = "flex";
  $("#res-q").value = state.q;
  renderTabs(state.cat);
  runSearch();
  window.scrollTo({ top: 0 });
}

/* ---------------- recent ---------------- */
function renderRecent(){
  const block = $("#recent-block"), chips = $("#recent-chips");
  if(!recent.length){ block.classList.add("hidden"); return; }
  block.classList.remove("hidden");
  chips.innerHTML = recent.map(q =>
    `<button class="chip" data-q="${esc(q)}">${ICONS.search}<span>${esc(q.length > 34 ? q.slice(0, 34) + "…" : q)}</span></button>`
  ).join("");
  $$("#recent-chips .chip").forEach(b => b.addEventListener("click", () => go({ q: b.dataset.q, cat: "general", page: 1, timeRange: "" })));
}

/* ---------------- modal ---------------- */
function openModal(){
  $("#set-lang").value = settings.lang;
  $("#set-safe").value = settings.safe;
  $("#set-theme").value = settings.theme;
  $("#modal-back").classList.add("open");
}
function closeModal(){ $("#modal-back").classList.remove("open"); }

/* ---------------- lucky ---------------- */
async function feelingLucky(q){
  q = (q || "").trim();
  if(!q){ $("#home-q").focus(); return; }
  toast("Mencari hasil pertama…");
  const mock = maybeMock();
  try {
    const data = mock || await searxSearch({ q, cat: "general", page: 1, timeRange: "" });
    const first = (data.results || [])[0];
    if(first && first.url){ pushRecent(q); window.open(first.url, "_blank", "noopener"); }
    else toast("Tidak ada hasil ditemukan.");
  } catch { toast("Gagal terhubung ke SearXNG."); }
}

/* ---------------- wire up ---------------- */
function init(){
  applyTheme();
  renderRecent();

  $("#theme-home").addEventListener("click", toggleTheme);
  $("#theme-res").addEventListener("click", toggleTheme);
  $("#settings-home").addEventListener("click", openModal);
  $("#settings-res").addEventListener("click", openModal);
  $("#modal-close").addEventListener("click", closeModal);
  $("#modal-back").addEventListener("click", e => { if(e.target.id === "modal-back") closeModal(); });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape") closeModal();
    if(e.key === "/" && !/input|select|textarea/i.test(document.activeElement.tagName)){
      e.preventDefault();
      const v = $("#view-results").style.display === "flex" ? $("#res-q") : $("#home-q");
      v.focus(); v.select();
    }
  });

  $("#set-save").addEventListener("click", () => {
    settings.lang = $("#set-lang").value;
    settings.safe = $("#set-safe").value; settings.theme = $("#set-theme").value;
    saveSettings(); applyTheme(); closeModal(); toast("Pengaturan disimpan.");
    if(state.q) runSearch();
  });
  $("#set-reset").addEventListener("click", () => {
    settings = Object.assign({}, DEFAULTS); saveSettings(); applyTheme(); openModal(); toast("Pengaturan dikembalikan.");
  });

  $("#home-form").addEventListener("submit", e => {
    e.preventDefault();
    const q = $("#home-q").value.trim();
    if(!q){ $("#home-q").focus(); return; }
    go({ q, cat: "general", page: 1, timeRange: "" });
  });
  $("#lucky-btn").addEventListener("click", () => feelingLucky($("#home-q").value));
  $("#res-form").addEventListener("submit", e => {
    e.preventDefault();
    const q = $("#res-q").value.trim();
    if(!q){ $("#res-q").focus(); return; }
    go({ q, page: 1 });
  });
  $("#foot-about").addEventListener("click", e => {
    e.preventDefault();
    toast("Cari Apa — cari web tanpa dilacak.");
  });

  if(matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if(settings.theme === "auto") applyTheme(); });

  route();
}
document.addEventListener("DOMContentLoaded", init);
</script>
